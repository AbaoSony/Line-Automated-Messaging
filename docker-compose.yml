services:
  line-messaging:
    build:
      context: .
      dockerfile: Dockerfile
    image: line-messaging:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_PORT: "8080"
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:?Set LINE_CHANNEL_SECRET in environment or .env}
      LINE_CHANNEL_TOKEN: ${LINE_CHANNEL_TOKEN:?Set LINE_CHANNEL_TOKEN in environment or .env}
      LINE_INTERNAL_PUSH_ENABLED: ${LINE_INTERNAL_PUSH_ENABLED:-false}
      LINE_INTERNAL_PUSH_TOKEN: ${LINE_INTERNAL_PUSH_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in environment or .env}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?Set DATABASE_USERNAME in environment or .env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in environment or .env}
      CHAT_CLEANUP_ENABLED: ${CHAT_CLEANUP_ENABLED:-false}
      CHAT_RETENTION_DAYS: ${CHAT_RETENTION_DAYS:-90}
      CHAT_CLEANUP_INTERVAL: ${CHAT_CLEANUP_INTERVAL:-1h}
      EVENT_LOG_CLEANUP_ENABLED: ${EVENT_LOG_CLEANUP_ENABLED:-false}
      EVENT_LOG_RETENTION_DAYS: ${EVENT_LOG_RETENTION_DAYS:-30}
      EVENT_LOG_CLEANUP_INTERVAL: ${EVENT_LOG_CLEANUP_INTERVAL:-1h}
      AUDIT_LOG_CLEANUP_ENABLED: ${AUDIT_LOG_CLEANUP_ENABLED:-false}
      AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS:-180}
      AUDIT_LOG_CLEANUP_INTERVAL: ${AUDIT_LOG_CLEANUP_INTERVAL:-1h}
      LOG_QUEUE_CAPACITY: ${LOG_QUEUE_CAPACITY:-4096}
      LOG_BATCH_SIZE: ${LOG_BATCH_SIZE:-100}
      LOG_FLUSH_INTERVAL: ${LOG_FLUSH_INTERVAL:-1s}
      LOG_POOL_SIZE: ${LOG_POOL_SIZE:-2}
      LOG_CONNECTION_TIMEOUT_MS: ${LOG_CONNECTION_TIMEOUT_MS:-1000}
      LOG_QUERY_TIMEOUT_SECONDS: ${LOG_QUERY_TIMEOUT_SECONDS:-3}
      AI_TOTAL_TIMEOUT: ${AI_TOTAL_TIMEOUT:-45s}
      AI_SEND_RESERVE: ${AI_SEND_RESERVE:-3s}
      AI_QUEUE_WAIT: ${AI_QUEUE_WAIT:-3s}
      AI_LOCK_WAIT: ${AI_LOCK_WAIT:-500ms}
      AI_DEPENDENCY_TIMEOUT: ${AI_DEPENDENCY_TIMEOUT:-500ms}
      AI_WORKERS: ${AI_WORKERS:-4}
      AI_QUEUE_CAPACITY: ${AI_QUEUE_CAPACITY:-256}
      AI_USER_QUEUE_CAPACITY: ${AI_USER_QUEUE_CAPACITY:-3}
      AI_MAX_USERS: ${AI_MAX_USERS:-1024}
      AI_TECHNICAL_REPLIES_ENABLED: ${AI_TECHNICAL_REPLIES_ENABLED:-false}
      AI_FALLBACK: ${AI_FALLBACK:-剛剛沒能順利回覆，可以再說一次嗎？}
      AI_BUSY: ${AI_BUSY:-我還在處理上一則訊息，稍等一下再傳喔。}
      AI_RATE_LIMITED: ${AI_RATE_LIMITED:-訊息有點多，稍等一下再聊喔。}
      AI_UNAVAILABLE: ${AI_UNAVAILABLE:-服務暫時開小差了，晚點再試一下喔。}
      AI_INPUT_TOO_LONG: ${AI_INPUT_TOO_LONG:-這則訊息有點長，可以分短一點說嗎？}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in environment or .env}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6.1-sol}
      OPENAI_REASONING: ${OPENAI_REASONING:-low}
      AI_MAX_INPUT_TOKENS: ${AI_MAX_INPUT_TOKENS:-8192}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-4096}
      AI_MODEL_TOTAL_TIMEOUT: ${AI_MODEL_TOTAL_TIMEOUT:-40s}
      AI_MODEL_ATTEMPT_TIMEOUT: ${AI_MODEL_ATTEMPT_TIMEOUT:-40s}
      AI_MODEL_CONNECT_TIMEOUT: ${AI_MODEL_CONNECT_TIMEOUT:-3s}
      AI_MODEL_RETRY_BACKOFF: ${AI_MODEL_RETRY_BACKOFF:-100ms}
      AI_NAMESPACE: ${AI_NAMESPACE:?Set AI_NAMESPACE in environment or .env}
      AI_MEMORY_ROUNDS: ${AI_MEMORY_ROUNDS:-10}
      AI_MEMORY_TTL: ${AI_MEMORY_TTL:-7d}
      AI_HISTORY_SCAN_LIMIT: ${AI_HISTORY_SCAN_LIMIT:-200}
      AI_RATE_LIMIT: ${AI_RATE_LIMIT:-12}
      AI_RATE_WINDOW: ${AI_RATE_WINDOW:-60s}
      REDIS_HOST: ${REDIS_HOST:?Set REDIS_HOST in environment or .env}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_SSL: ${REDIS_SSL:-false}
      USER_DELETION_TIMEOUT: ${USER_DELETION_TIMEOUT:-60s}
      APP_SERVICE: ${APP_SERVICE:-line-messaging-service}
      APP_ENV: ${APP_ENV:-local}
      APP_VERSION: ${APP_VERSION:-0.0.1-SNAPSHOT}
      APP_INSTANCE: ${APP_INSTANCE:-local}
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: ${APP_STOP_GRACE_PERIOD:-20m}
    restart: unless-stopped
