server:
  port: 8080

management:
  server:
    address: 127.0.0.1
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,info,metrics
    jmx:
      exposure:
        exclude: '*'
  endpoint:
    health:
      show-details: never

logging:
  config: classpath:logback-spring.xml
  structured:
    format:
      console: com.example.line.common.logging.JsonLogFormatter
  level:
    com.linecorp.bot.client.wire: OFF
    com.zaxxer.hikari.HikariConfig: OFF
    org.springframework.jdbc.core: INFO
    org.flywaydb.core.FlywayExecutor: WARN

spring:
  main:
    banner-mode: off
  flyway:
    locations: classpath:db/migration

line:
  ai:
    turns:
      enabled: ${AI_AGGREGATION_ENABLED:true}
    aggregation:
      collection-span: ${AI_AGGREGATION_COLLECTION_SPAN:6s}
      queue-reserve: ${AI_AGGREGATION_QUEUE_RESERVE:3s}
      dependency-reserve: ${AI_AGGREGATION_DEPENDENCY_RESERVE:1s}
      generation-reserve: ${AI_AGGREGATION_GENERATION_RESERVE:32s}
      rule-wait: ${AI_AGGREGATION_RULE_WAIT:1s}
      max-members: ${AI_AGGREGATION_MAX_MEMBERS:8}
      max-characters: ${AI_AGGREGATION_MAX_CHARACTERS:4096}
      max-buffered-members: ${AI_AGGREGATION_MAX_BUFFERED_MEMBERS:2048}
      max-buffered-characters: ${AI_AGGREGATION_MAX_BUFFERED_CHARACTERS:2000000}
      max-regenerations: ${AI_AGGREGATION_MAX_REGENERATIONS:1}
      max-generation-attempts: ${AI_AGGREGATION_MAX_GENERATION_ATTEMPTS:2}
    decision:
      mode: ${AI_DECISION_MODE:MODEL}
      reasoning: ${AI_DECISION_REASONING:low}
      attempt-timeout: ${AI_DECISION_ATTEMPT_TIMEOUT:2s}
      max-attempts: ${AI_DECISION_MAX_ATTEMPTS:2}
      max-concurrent: ${AI_DECISION_MAX_CONCURRENT:1}
      max-input-tokens: ${AI_DECISION_MAX_INPUT_TOKENS:4096}
      max-output-tokens: ${AI_DECISION_MAX_OUTPUT_TOKENS:1024}
      failure-threshold: ${AI_DECISION_FAILURE_THRESHOLD:5}
      cooldown: ${AI_DECISION_COOLDOWN:30s}
      technical-reply-cooldown: ${AI_TECHNICAL_REPLY_COOLDOWN:10s}
    total-timeout: ${AI_TOTAL_TIMEOUT:45s}
    send-reserve: ${AI_SEND_RESERVE:3s}
    queue-wait: ${AI_QUEUE_WAIT:3s}
    lock-wait: ${AI_LOCK_WAIT:500ms}
    dependency-timeout: ${AI_DEPENDENCY_TIMEOUT:500ms}
    workers: ${AI_WORKERS:4}
    queue-capacity: ${AI_QUEUE_CAPACITY:256}
    user-queue-capacity: ${AI_USER_QUEUE_CAPACITY:3}
    max-users: ${AI_MAX_USERS:1024}
    technical-replies-enabled: ${AI_TECHNICAL_REPLIES_ENABLED:false}
    fallback: ${AI_FALLBACK:剛剛沒能順利回覆，可以再說一次嗎？}
    busy: ${AI_BUSY:我還在處理上一則訊息，稍等一下再傳喔。}
    rate-limited: ${AI_RATE_LIMITED:訊息有點多，稍等一下再聊喔。}
    unavailable: ${AI_UNAVAILABLE:服務暫時開小差了，晚點再試一下喔。}
    input-too-long: ${AI_INPUT_TOO_LONG:這則訊息有點長，可以分短一點說嗎？}
    credentials:
      api-key: ${OPENAI_API_KEY:}
    model:
      name: ${OPENAI_MODEL:gpt-6.1-sol}
      reasoning: ${OPENAI_REASONING:low}
      max-input-tokens: ${AI_MAX_INPUT_TOKENS:8192}
      max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:4096}
      total-timeout: ${AI_MODEL_TOTAL_TIMEOUT:40s}
      attempt-timeout: ${AI_MODEL_ATTEMPT_TIMEOUT:40s}
      connect-timeout: ${AI_MODEL_CONNECT_TIMEOUT:3s}
      retry-backoff: ${AI_MODEL_RETRY_BACKOFF:100ms}
    memory:
      namespace: ${AI_NAMESPACE:}
      rounds: ${AI_MEMORY_ROUNDS:10}
      ttl: ${AI_MEMORY_TTL:7d}
      scan-limit: ${AI_HISTORY_SCAN_LIMIT:200}
      rate-limit: ${AI_RATE_LIMIT:12}
      rate-window: ${AI_RATE_WINDOW:60s}
    redis:
      host: ${REDIS_HOST:}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl: ${REDIS_SSL:false}
  user-deletion:
    timeout: ${USER_DELETION_TIMEOUT:60s}
  event-recorder:
    queue-capacity: ${LOG_QUEUE_CAPACITY:4096}
    batch-size: ${LOG_BATCH_SIZE:100}
    flush-interval: ${LOG_FLUSH_INTERVAL:1s}
    pool-size: ${LOG_POOL_SIZE:2}
    connection-timeout-ms: ${LOG_CONNECTION_TIMEOUT_MS:1000}
    query-timeout-seconds: ${LOG_QUERY_TIMEOUT_SECONDS:3}
  event-log:
    cleanup-enabled: ${EVENT_LOG_CLEANUP_ENABLED:false}
    retention-days: ${EVENT_LOG_RETENTION_DAYS:30}
    cleanup-interval: ${EVENT_LOG_CLEANUP_INTERVAL:1h}
  audit-log:
    cleanup-enabled: ${AUDIT_LOG_CLEANUP_ENABLED:false}
    retention-days: ${AUDIT_LOG_RETENTION_DAYS:180}
    cleanup-interval: ${AUDIT_LOG_CLEANUP_INTERVAL:1h}
  logging:
    service: ${APP_SERVICE:line-messaging-service}
    env: ${APP_ENV:local}
    version: ${APP_VERSION:0.0.1-SNAPSHOT}
    instance: ${APP_INSTANCE:${HOSTNAME:${COMPUTERNAME:local}}}
    readable-file: ${LOCAL_LOG_FILE:logs/application-readable.log}
  database:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    pool-size: ${DATABASE_POOL_SIZE:8}
    connection-timeout-ms: ${DATABASE_CONNECTION_TIMEOUT_MS:3000}
  persistence:
    workers: 2
    queue-capacity: 512
    shutdown-timeout: 30s
    cleanup-batch-size: 500
  chat:
    cleanup-enabled: ${CHAT_CLEANUP_ENABLED:false}
    retention-days: ${CHAT_RETENTION_DAYS:90}
    cleanup-interval: ${CHAT_CLEANUP_INTERVAL:1h}
    history-max-limit: 100
  bot:
    # Empty defaults allow LineProperties to report missing values clearly.
    channel-secret: ${LINE_CHANNEL_SECRET:}
    channel-token: ${LINE_CHANNEL_TOKEN:}
  webhook:
    workers: 4
    queue-capacity: 256
    dedup-ttl: 24h
    dedup-max-entries: 10000
    content-max-bytes: 10485760
  send:
    max-attempts: 3
    attempt-timeout: 3s
    initial-backoff: 200ms
  internal-push:
    enabled: ${LINE_INTERNAL_PUSH_ENABLED:false}
    token: ${LINE_INTERNAL_PUSH_TOKEN:}
